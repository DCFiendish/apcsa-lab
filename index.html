// Structure mirrors the official College Board CED (2025-26 revision): 4 units,

const UNITS = [
  {
    num: 1, title: 'Using Objects and Methods', weight: '15–25%',
    topics: [
      {
        id: '1.1', title: 'Intro to Algorithms, Programming & Compilers',
        concept: `<p>An <b>algorithm</b> is just a precise, ordered list of steps to solve a problem — a recipe. A program is an algorithm written in a language a computer can act on. Java programs are text files (<code>.java</code>) that go through a <b>compiler</b>, which translates your source code into <b>bytecode</b>, a lower-level form the Java Virtual Machine (JVM) actually runs. This compile step is why Java catches many mistakes before your program ever executes.</p>
        <p>Three things can go wrong, and it matters which one you're dealing with:</p>
        <ul>
          <li><b>Syntax error</b> — you broke Java's grammar (missing semicolon, unmatched brace). The compiler refuses to produce bytecode at all, and tells you exactly where.</li>
          <li><b>Runtime error</b> (exception) — the code compiles fine, but something fails while running (dividing by zero, accessing something that doesn't exist). The program crashes mid-execution with a stack trace.</li>
          <li><b>Logic error</b> — the code compiles, runs, finishes normally, and produces output... that's just wrong. Nothing complains. This is the dangerous one, because the computer has no idea you meant something different.</li>
        </ul>
        <p>The compiler only ever catches the first kind. The other two are on you — which is the entire reason testing your own code (not just getting it to compile) matters.</p>`,
        pitfalls: [`The compiler checks syntax and types, never intent. It will happily compile a wrong formula.`],
        example: {
          label: 'Worked example — a simple sequence',
          code: `public class Main {
    public static void main(String[] args) {
        int milesDriven = 120;
        int gallonsUsed = 4;
        double milesPerGallon = milesDriven / (double) gallonsUsed;
        System.out.println("MPG: " + milesPerGallon);
    }
}`
        },
        exercises: [{
          id: 't1_1e1',
          prompt: 'This compiles and runs with no error or exception — it is a pure logic error. Fix it so it prints the true average of a and b.',
          starter: `public class Main {
    public static void main(String[] args) {
        int a = 4, b = 6;
        int result = a + b / 2; // intended: the average of a and b
        System.out.println(result);
    }
}`,
          check: out => out.trim() === '5',
          hint: '/ binds tighter than +. You need (a + b) / 2, not a + (b / 2).'
        }]
      },
      {
        id: '1.2', title: 'Variables and Data Types',
        concept: `<p>A <b>variable</b> is a named storage location. In Java you must <b>declare</b> its type before using it, and that type never changes — this is called <b>static typing</b>. The declaration syntax is <code>type name = value;</code>:</p>
        <pre class="mono" style="background:#0e0f13;padding:10px 14px;border-radius:6px;overflow-x:auto;">int age = 16;
double price = 4.99;
boolean isEnrolled = true;
char grade = 'A';</pre>
        <p>The four primitive types you'll use constantly:</p>
        <ul>
          <li><code>int</code> — a whole number (no decimal point), e.g. <code>-3</code>, <code>0</code>, <code>42</code>.</li>
          <li><code>double</code> — a decimal (floating-point) number, e.g. <code>3.14</code>, <code>-0.5</code>.</li>
          <li><code>boolean</code> — only ever <code>true</code> or <code>false</code>. No quotes, no other values.</li>
          <li><code>char</code> — a single character, written in <b>single</b> quotes: <code>'A'</code>, <code>'7'</code>, <code>'$'</code>. (A String, by contrast, uses double quotes and can hold any number of characters — it's not a primitive at all, but an object, which matters starting in 1.12.)</li>
        </ul>
        <p>These are called "primitive" because the variable holds the actual value directly, not a reference to something else — unlike objects.</p>`,
        example: {
          label: 'Worked example — declaring and printing each type',
          code: `public class Main {
    public static void main(String[] args) {
        int age = 16;
        double price = 4.99;
        boolean isEnrolled = true;
        char grade = 'A';
        System.out.println(age);
        System.out.println(price);
        System.out.println(isEnrolled);
        System.out.println(grade);
    }
}`
        },
        exercises: [{
          id: 't1_2e1',
          prompt: 'Declare a double named gpa set to 3.85 and a boolean named honorRoll set to true. Print gpa, then print honorRoll, each on its own line.',
          starter: `public class Main {
    public static void main(String[] args) {
        // TODO: declare gpa (double, 3.85) and honorRoll (boolean, true)

        // TODO: print gpa, then print honorRoll
    }
}`,
          check: out => out.trim() === '3.85\ntrue',
          hint: 'double gpa = 3.85; boolean honorRoll = true; then two println calls.'
        }]
      },
      {
        id: '1.3', title: 'Expressions and Output',
        concept: `<p>An <b>expression</b> is anything that evaluates to a value: <code>3 + 4</code>, <code>x * 2</code>, <code>"a" + "b"</code>. Java's arithmetic operators are <code>+ - * / %</code> (the last, <b>modulus</b>, gives the remainder of division: <code>7 % 2</code> is <code>1</code>). They follow the math order-of-operations you already know — <code>*</code>, <code>/</code>, <code>%</code> before <code>+</code>, <code>-</code> — and parentheses override that order, same as algebra.</p>
        <p>To display a value, use <code>System.out.println(...)</code> (prints, then moves to a new line) or <code>System.out.print(...)</code> (prints, stays on the same line). You can join text and values with <code>+</code>: <code>System.out.println("Score: " + 95);</code> prints <code>Score: 95</code> — once either side of a <code>+</code> is a String, Java converts the other side to text instead of adding numbers.</p>
        <p>One thing has no analogue in ordinary math: the type of a division depends on the types of its operands. <code>int / int</code> performs <b>integer division</b> — it throws away the remainder entirely (truncates toward zero) rather than rounding. <code>7 / 2</code> is <code>3</code>, not <code>3.5</code>. If either operand is a <code>double</code>, the division is done with decimals and you get the value you'd expect.</p>`,
        pitfalls: [`<b>AP trap:</b> <code>int total = (score1 + score2 + score3) / 3;</code> silently truncates the average. If any operand is an <code>int</code>, the whole division is integer division — cast at least one side to <code>double</code>.`],
        example: {
          label: 'Worked example — division & modulus',
          code: `public class Main {
    public static void main(String[] args) {
        int a = 7;
        int b = 2;
        System.out.println(a / b);          // integer division
        System.out.println(a / (double) b);  // cast forces double division
        System.out.println(a % b);           // modulus (remainder)
    }
}`
        },
        exercises: [{
          id: 't1_3e1',
          prompt: 'This computes an average test score, but integer division is silently truncating it. Fix the code so it divides using doubles.',
          starter: `public class Main {
    public static void main(String[] args) {
        int score1 = 88, score2 = 92, score3 = 79;
        double average = (score1 + score2 + score3) / 3; // BUG
        System.out.println(average);
    }
}`,
          check: out => {
            const n = parseFloat(out.trim());
            return !isNaN(n) && Math.abs(n - 86.33333333333333) < 0.001;
          },
          hint: 'Expected roughly 86.33333333333333 — cast one operand to double, e.g. (double)(score1+score2+score3) / 3.'
        }]
      },
      {
        id: '1.4', title: 'Assignment Statements and Input',
        concept: `<p>The <code>=</code> sign in Java is not the math symbol for equality — it's the <b>assignment operator</b>. <code>x = 5;</code> means "compute the right side, then store that value into x," full stop. Java always fully evaluates the entire right-hand side <i>before</i> storing anything, which is why <code>x = x + 1;</code> works: it reads the current (old) value of x, adds 1, and only then overwrites x with the result.</p>
        <p>Assignment is <b>right-associative</b> and itself produces the assigned value, so you can chain it: <code>a = b = c = 10;</code> evaluates right to left, assigning 10 to c, then to b, then to a — all three end up holding 10.</p>
        <p>To get input from a user, real Java programs use <code>java.util.Scanner</code> reading from <code>System.in</code> (e.g. <code>Scanner in = new Scanner(System.in); int n = in.nextInt();</code>). Console input isn't available in this browser sandbox, so we won't run that here — but you'll see it in real Java code and possibly on the exam as a concept.</p>`,
        example: {
          label: 'Worked example — chained assignment',
          code: `public class Main {
    public static void main(String[] args) {
        int a, b;
        a = b = 5;
        System.out.println(a);
        System.out.println(b);
    }
}`
        },
        pitfalls: [`<code>x = x + 1</code> isn't circular. The old value of x is read completely before the new value overwrites it.`],
        exercises: [{
          id: 't1_4e1',
          prompt: 'Predict the final values, then run to check.',
          starter: `public class Main {
    public static void main(String[] args) {
        int a, b, c;
        a = b = c = 10;
        a = a + b;
        b = a - b;
        System.out.println(a + " " + b + " " + c);
    }
}`,
          check: out => out.trim() === '20 10 10',
          hint: 'Chained assignment sets a, b, c all to 10 first. Then trace top to bottom using the OLD value of a variable before its line overwrites it.'
        }]
      },
      {
        id: '1.5', title: 'Casting and Range of Variables',
        concept: `<p><b>Casting</b> converts a value from one type to another. There are two directions, and they behave very differently:</p>
        <ul>
          <li><b>Widening</b> (small type → bigger type, e.g. <code>int</code> → <code>double</code>) happens <b>automatically</b>, no cast needed, and never loses information: <code>double d = 5;</code> silently becomes <code>5.0</code>.</li>
          <li><b>Narrowing</b> (big type → smaller type, e.g. <code>double</code> → <code>int</code>) can lose information, so Java forces you to be explicit with a cast: <code>(int) 5.9</code>. The syntax is the target type in parentheses, right before the value.</li>
        </ul>
        <p>Casting a <code>double</code> to an <code>int</code> specifically <b>truncates</b> — it chops off everything after the decimal point. It does not round to the nearest whole number. <code>(int) 5.9</code> is <code>5</code>, and <code>(int) -5.9</code> is <code>-5</code> (truncation always moves toward zero, not just downward). "Range" in this topic's title refers to the fact that each numeric type can only hold values in a certain range (<code>int</code> maxes out around 2.1 billion) — going past it wraps around unexpectedly, though you're unlikely to hit that outside specifically-designed exam questions.</p>`,
        example: {
          label: 'Worked example — widening vs. narrowing',
          code: `public class Main {
    public static void main(String[] args) {
        int wholeNumber = 5;
        double widened = wholeNumber;      // automatic, no cast needed
        double decimalValue = 5.9;
        int narrowed = (int) decimalValue;  // explicit cast required
        System.out.println(widened);
        System.out.println(narrowed);
    }
}`
        },
        pitfalls: [`<code>(int)</code> cast truncates, it does not round. <code>(int) 19.99</code> is <code>19</code>, not <code>20</code>.`],
        exercises: [{
          id: 't1_5e1',
          prompt: 'Predict, then run: what happens when a double is cast to an int?',
          starter: `public class Main {
    public static void main(String[] args) {
        double price = 19.99;
        int dollars = (int) price;
        System.out.println(dollars);
    }
}`,
          check: out => out.trim() === '19',
          hint: 'Casting to int truncates the decimal — it does not round to 20.'
        }]
      },
      {
        id: '1.6', title: 'Compound Assignment Operators',
        concept: `<p>Adding to a variable and reassigning it is common enough that Java has a shorthand for it. These two lines do exactly the same thing:</p>
        <pre class="mono" style="background:#0e0f13;padding:10px 14px;border-radius:6px;overflow-x:auto;">total = total + 5;
total += 5;   // identical, shorter</pre>
        <p>Every arithmetic operator has a compound form: <code>+=</code>, <code>-=</code>, <code>*=</code>, <code>/=</code>, <code>%=</code>. Each means "take my current value, apply this operation with the right-hand side, store the result back in me." When a program has several of these in a row, they execute one at a time, top to bottom — each line's effect is fully applied before the next line reads the variable.</p>`,
        example: {
          label: 'Worked example — chaining compound operators',
          code: `public class Main {
    public static void main(String[] args) {
        int total = 10;
        total += 5;   // 15
        total -= 2;   // 13
        total *= 3;   // 39
        System.out.println(total);
    }
}`
        },
        exercises: [{
          id: 't1_6e1',
          prompt: 'Trace the compound assignments by hand, then run to check your prediction for the final value of total.',
          starter: `public class Main {
    public static void main(String[] args) {
        int total = 10;
        total += 5;
        total *= 2;
        total -= 3;
        System.out.println(total);
    }
}`,
          check: out => out.trim() === '27',
          hint: 'Step through it: 10 -> 15 -> 30 -> 27.'
        }]
      },
      {
        id: '1.7', title: 'Application Program Interface (API) and Libraries',
        concept: `<p>You don't have to write everything from scratch — Java ships with a huge <b>standard library</b> of pre-written classes, organized into <b>packages</b> (namespaces, written with dots: <code>java.util</code>, <code>java.io</code>). An <b>API</b> (Application Program Interface) is the public list of classes and methods a library exposes for you to call — you use it by name and signature without needing to know how it's implemented inside.</p>
        <p>To use a class from a package, you <code>import</code> it at the top of the file, before the class declaration:</p>
        <pre class="mono" style="background:#0e0f13;padding:10px 14px;border-radius:6px;overflow-x:auto;">import java.util.Random;

public class Main {
    public static void main(String[] args) {
        Random rng = new Random();
        // ...
    }
}</pre>
        <p>One package is special: <code>java.lang</code> (containing <code>String</code>, <code>Math</code>, <code>Integer</code>, <code>System</code>...) is imported <b>automatically</b> into every Java file — that's why you've been using <code>Math</code> and <code>String</code> already without any <code>import</code> line.</p>`,
        example: {
          label: 'Worked example — importing a library class',
          code: `import java.util.Random;

public class Main {
    public static void main(String[] args) {
        Random rng = new Random(42); // fixed seed -> reproducible sequence
        System.out.println(rng.nextInt(100));
    }
}`
        },
        exercises: [{
          id: 't1_7e1',
          prompt: 'Add the missing import so this compiles, then run it.',
          starter: `// TODO: import java.util.Random

public class Main {
    public static void main(String[] args) {
        Random rng = new Random(7);
        System.out.println(rng.nextInt(50));
    }
}`,
          check: out => out.trim() === '36',
          hint: 'import java.util.Random; goes on its own line, before the class declaration.'
        }]
      },
      {
        id: '1.8', title: 'Documentation with Comments',
        concept: `<p><b>Comments</b> are text the compiler ignores completely — they exist purely for the humans reading the code later (including future you). Java has three styles:</p>
        <ul>
          <li><code>// text</code> — a <b>line comment</b>. Everything from <code>//</code> to the end of the line is ignored. Use it for a quick note next to a line of code.</li>
          <li><code>/* text */</code> — a <b>block comment</b>. Can span multiple lines; everything between the markers is ignored. Use it to temporarily disable a chunk of code, or explain something longer.</li>
          <li><code>/** text */</code> — a <b>Javadoc comment</b>, placed right above a class or method. It's still just a comment to the compiler, but documentation-generating tools and IDEs read it specially to show tooltips and generate reference docs.</li>
        </ul>
        <p>Good comments explain <i>why</i> something is done a non-obvious way — not <i>what</i> the code does line by line, which well-named variables and methods should already make clear.</p>`,
        example: {
          label: 'Worked example — comment styles',
          code: `/** Computes and prints the area of a circle. */
public class Main {
    public static void main(String[] args) {
        double radius = 3.0; // measured in centimeters
        /* Area of a circle = pi * r^2 */
        System.out.println(Math.PI * radius * radius);
    }
}`
        },
        exercises: [{
          id: 't1_8e1',
          prompt: 'Replace the placeholder comment with your own line comment explaining what rate represents, and add a one-line Javadoc comment directly above the class declaration. (The program must still compile and print the same number.)',
          starter: `public class Main {
    public static void main(String[] args) {
        double rate = 0.075; // TODO: replace with your own comment explaining rate
        double amount = 40.0;
        System.out.println(amount * rate);
    }
}`,
          check: out => out.trim() === '3.0',
          checkSource: src => src.includes('/**') && src.includes('*/') && !src.includes('TODO'),
          hint: 'Add /** ... */ right above "public class Main", and rewrite the // comment on the rate line (just delete "TODO" and describe what rate is) — don\'t change the numbers.'
        }]

      {
        id: '1.9', title: 'Method Signatures',
        concept: `<p>A <b>method</b> is a named, reusable block of code you invoke by writing its name followed by parentheses: <code>Math.sqrt(25)</code>. Whatever goes inside the parentheses are its <b>arguments</b>; a method may also produce a <b>return value</b> you can use, like <code>Math.sqrt(25)</code> returning <code>5.0</code>. (You'll write your own methods starting in Unit 3 — for now you're just calling ones Java already provides.)</p>
        <p>A method's <b>signature</b> is its name plus the number and types of its parameters — notably, the <b>return type is not part of the signature</b>. This matters because of <b>overloading</b>: multiple methods can share the same name as long as their parameter types differ, e.g. <code>println(int)</code> and <code>println(String)</code> are two different overloads of <code>println</code>. When you call an overloaded method, the compiler looks at the arguments you passed and picks the overload that matches — widening a primitive (like <code>int</code> → <code>double</code>) automatically if there's no exact match.</p>
        <p>Why does Java bother with overloading at all, instead of forcing every method to have a unique name? Because it lets an API read naturally: you call <code>println</code> the same way whether you're printing a number, a word, or a boolean, instead of memorizing <code>printlnInt</code>, <code>printlnString</code>, <code>printlnBoolean</code> as separate names. The tradeoff is that you need to understand the resolution rule (exact match first, then widening) to predict which overload actually runs — which is exactly what makes it a favorite source of AP exam trick questions.</p>`,
        pitfalls: [`<code>Math.max(3, 4.5)</code> has no <code>max(int, double)</code> overload to match, so the <code>3</code> widens to a double first — the call resolves to <code>max(double, double)</code>, and the result is a <b>double</b>, not an int.`],

        id: '1.10', title: 'Calling Class Methods',
        concept: `<p>Some methods belong to the <b>class itself</b> rather than to any particular object — these are <code>static</code> methods, and you call them as <code>ClassName.methodName(args)</code>, no object required. You've already been doing this with <code>Math.sqrt(...)</code> and <code>Math.pow(...)</code>. (The opposite — <b>instance</b> methods, called on a specific object — is covered in 1.14.)</p>
        <p>Two static methods you'll use constantly: <code>Integer.parseInt(String)</code> converts text like <code>"42"</code> into the int <code>42</code>, and <code>Double.parseDouble(String)</code> does the same for decimals. These are the standard way to turn real-world text (user input, file contents) into numbers you can actually compute with — you can't do arithmetic on a String.</p>`,

        <ul>

      {
        id: '1.12', title: 'Objects: Instances of Classes',
        concept: `<p>Everything you've used so far (<code>int</code>, <code>double</code>, <code>boolean</code>, <code>char</code>) is a <b>primitive</b> — the variable holds the actual value. An <b>object</b> is different: an object variable holds a <b>reference</b> (essentially, a memory address) pointing to where the object actually lives. <code>String</code>, which you've been using since 1.2, is secretly an object, not a primitive — it just gets special convenience syntax (double-quoted literals) that makes it look like one.</p>
        <p>This distinction matters most for comparison. <code>==</code> on primitives compares values, exactly like you'd expect. But <code>==</code> on objects compares <b>references</b> — it asks "do these two variables point to the exact same object in memory?", not "do they represent the same content?" Two completely separate String objects can hold identical characters and still fail an <code>==</code> check, because they're different objects at different addresses. To compare an object's actual content, use its <code>.equals()</code> method instead.</p>
        <p>Think of a primitive variable as a box that directly contains its value. An object variable, by contrast, is more like a sticky note with an address written on it — the actual object lives elsewhere in memory, and the variable just points to it. Copying a primitive copies the value itself; copying an object reference just copies the address, so both variables end up pointing at the very same object. This is exactly why <code>==</code> behaves so differently for the two: comparing two "boxes" compares what's inside them, but comparing two "sticky notes" only checks whether they point to the same place.</p>`,
        pitfalls: [`<code>new String("hi") == new String("hi")</code> is <b>false</b>. Same characters, different objects. This is the single most common AP trap involving objects.`],

        id: '1.13', title: 'Object Creation and Storage (Instantiation)',
        concept: `<p>To bring an object into existence, you use the <code>new</code> keyword followed by a call that looks like a method — this is a <b>constructor</b>: <code>String s = new String("hi");</code>. The constructor allocates memory for the object, sets it up, and <code>new</code> hands back a reference to it, which you store in a variable. From then on, that variable is your handle to the object — you call its instance methods through it with dot notation: <code>s.length()</code>.</p>
        <p>(In practice, String literals like <code>"hi"</code> already create a String object behind the scenes, so you rarely write <code>new String(...)</code> in real code — but seeing it explicitly here makes the object-creation step visible instead of hidden.)</p>
        <p>A <b>constructor</b> looks like a method with the same name as the class and no return type — its job is purely to set up a new object's initial state. You'll write your own constructors starting in Unit 3 when you design classes yourself; for now, every class you use (<code>String</code>, <code>Random</code>, and later <code>Scanner</code>, <code>ArrayList</code>) already comes with constructors built in, and <code>new</code> is how you invoke one.</p>`,

      {
        id: '1.14', title: 'Calling Instance Methods',
        concept: `<p>An <b>instance method</b> acts on one specific object and is called through it: <code>object.methodName(args)</code>. This is the mirror image of 1.10's static methods — there's no <code>ClassName.method()</code> shortcut here; you need an actual object (instance) to call one on, because the method typically works with that object's own data.</p>
        <p><code>String</code> is full of instance methods worth knowing well:</p>
        <ul>
          <li><code>.length()</code> — number of characters.</li>
          <li><code>.charAt(i)</code> — the character at index <code>i</code> (indices start at 0).</li>
          <li><code>.toUpperCase()</code> / <code>.toLowerCase()</code> — a new String, case-converted.</li>
          <li><code>.indexOf(x)</code> — position of the first occurrence of <code>x</code>, or <code>-1</code> if absent.</li>
          <li><code>.equals(other)</code> — content comparison (see 1.12).</li>
        </ul>
        <p>Notice the pattern in every one of these: you write the object first, a dot, then the method name — <code>course.length()</code>, not <code>length(course)</code>. That's the visual signature of an instance method. Static methods (1.10) read the other way around, class name first: <code>Integer.parseInt(text)</code>. Once you can tell these two calling patterns apart on sight, a lot of Java code becomes much easier to read.</p>`,

        id: '1.15', title: 'String Manipulation',
        concept: `<p>The single most important fact about <code>String</code>: it's <b>immutable</b>. Once created, a String object's characters can never change. Every method that looks like it's modifying one — <code>.substring(...)</code>, <code>.toUpperCase()</code>, <code>.concat(...)</code>, <code>.replace(...)</code> — actually leaves the original untouched and returns a brand-new String with the result. This is why <code>s.toUpperCase();</code> alone does nothing useful: you have to capture the return value, <code>s = s.toUpperCase();</code>.</p>
        <p>Common methods, beyond the ones from 1.14:</p>
        <ul>
          <li><code>.substring(start, end)</code> — the characters from index <code>start</code> up to <b>but not including</b> index <code>end</code>. <code>.substring(start)</code> alone goes to the end of the string.</li>
          <li><code>.concat(other)</code> — joins two Strings (equivalent to <code>+</code>).</li>
          <li><code>.trim()</code> — a copy with leading/trailing whitespace removed.</li>
          <li><code>.compareTo(other)</code> — negative, zero, or positive, for alphabetical ordering.</li>
        </ul>
        <p><code>indexOf</code> returns <code>-1</code>, not a boolean, when it finds nothing — treating that <code>-1</code> as if it meant "false" is a common mistake, since <code>-1</code> is just as truthy/nonzero as any other int.</p>
        <p>Indexing works the same way it did for <code>.charAt(i)</code> back in 1.14: the first character is index 0, and the last is index <code>length() - 1</code>. <code>substring</code>'s "end index excluded" rule has a convenient side effect worth memorizing: <code>end - start</code> always tells you exactly how many characters you get back — <code>substring(2, 5)</code> gives you <code>5 - 2 = 3</code> characters.</p>`,

}`

      {
        id: '2.1', title: 'Algorithms with Selection and Repetition',
        concept: `<p>So far every program has run top to bottom, one statement after another — <b>sequence</b>. Real algorithms need two more tools: <b>selection</b> (branch — do this <i>or</i> that, depending on a condition) and <b>repetition</b> (loop — do this again, and again, until some condition changes). Every algorithm you'll ever write is built from just these three building blocks: sequence, selection, repetition.</p>
        <p>The next several topics teach selection (<code>if</code>) in detail first, then repetition (<code>while</code>, <code>for</code>). Here's a preview of the shape of both, so you recognize them once we slow down:</p>`,
        example: {
          label: 'Preview — selection and repetition together',
          code: `public class Main {
    public static void main(String[] args) {
        int n = 4;
        if (n % 2 == 0) {              // selection: branch on a condition
            System.out.println("even");
        } else {
            System.out.println("odd");
        }
        int i = 1;
        while (i <= 3) {                // repetition: repeat while true
            System.out.println("lap " + i);
            i++;
        }
    }
}`
        },

      {
        id: '2.2', title: 'Boolean Expressions',
        concept: `<p>A <b>boolean expression</b> is anything that evaluates to <code>true</code> or <code>false</code>. The relational operators build them from values you already know how to compute: <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, <code>&gt;=</code> (ordering), and <code>==</code>, <code>!=</code> (equal / not equal). These work on primitives — including <code>char</code>, which compares by Unicode value, so <code>'a' &lt; 'b'</code> is <code>true</code> the same way <code>1 &lt; 2</code> is.</p>
        <p>Relational operators bind more loosely than arithmetic, so <code>x + 1 &gt; y * 2</code> computes both sides first, exactly like you'd expect from math notation. A subtlety worth knowing: in some languages, writing <code>=</code> where you meant <code>==</code> silently compiles and causes chaos. Java protects you — <code>if (x = 5)</code> is a compile error unless <code>x</code> is itself a <code>boolean</code>, because assignment produces a value of x's type, not necessarily a boolean.</p>`,
        pitfalls: [`<code>==</code> compares object <b>references</b>, not content — this is the same trap from 1.12, and it applies to any boolean expression comparing two objects (Strings included).`],
        example: {
          label: 'Worked example — building boolean expressions',
          code: `public class Main {
    public static void main(String[] args) {
        int temperature = 72;
        boolean isWarm = temperature > 65;
        boolean isTooHot = temperature >= 90;
        System.out.println(isWarm);
        System.out.println(isTooHot);
    }
}`
        },
        exercises: [{
          id: 't2_2e1',
          prompt: 'Predict all three lines, then run to check.',
          starter: `public class Main {
    public static void main(String[] args) {

        System.out.println('a' < 'b');
        System.out.println(10 / 3 == 3);
    }
}`,

        }]
      },
      {
        id: '2.3', title: 'if Statements',
        concept: `<p>An <code>if</code> statement runs a block only when its boolean condition is true:</p>
        <pre class="mono" style="background:#0e0f13;padding:10px 14px;border-radius:6px;overflow-x:auto;">if (condition) {
    // runs only if condition is true
} else {
    // runs only if condition is false
}</pre>
        <p>You can chain more branches with <code>else if</code> (covered fully in 1.4's neighbor topic, 2.4). The <code>{ }</code> braces mark the block controlled by the <code>if</code> — but they're technically optional if the block is a single statement. That optionality is a trap, not a convenience.</p>`,
        pitfalls: [`Without braces, <code>if</code> controls <b>only the very next statement</b> — indentation is just a suggestion to human readers, the compiler doesn't care about it at all. A line that looks nested by indentation but isn't inside <code>{ }</code> runs unconditionally, every time.`],

          label: 'Worked example — if/else with braces',
          code: `public class Main {
    public static void main(String[] args) {

}`

      {
        id: '2.4', title: 'Nested if Statements',
        concept: `<p>An <code>if</code>/<code>else if</code>/<code>else</code> chain is checked <b>top to bottom</b>, and the first condition that's true wins — every later branch is skipped, even if it would also be true. This makes <b>order</b> a real design decision, not a style choice: put the most specific (tightest) condition first, and the most general (loosest) last.</p>`,
        pitfalls: [`A common bug: checking the loosest range first. <code>if (score &gt;= 60) ... else if (score &gt;= 90) ...</code> — a score of 95 satisfies <b>both</b> conditions, but the first one wins, so it never reaches the &gt;= 90 branch at all.`],

      {
        id: '2.5', title: 'Compound Boolean Expressions',
        concept: `<p>Combine boolean expressions with <code>&&</code> (and — both sides must be true), <code>||</code> (or — at least one side must be true), and <code>!</code> (not — flips true/false). Java evaluates these with <b>short-circuit evaluation</b>: for <code>&&</code>, if the left side is false, the right side is never evaluated at all (the answer is already known to be false); for <code>||</code>, if the left side is true, the right side is skipped too.</p>
        <p>This isn't just an optimization — it's a tool. You can use it to guard against an operation that would otherwise fail:</p>`,
        pitfalls: [`Order matters for a short-circuit guard. <code>if (b != 0 && a / b > 1)</code> is safe — <code>b != 0</code> is checked first, and if it's false the division never runs. Swap the order to <code>if (a / b > 1 && b != 0)</code> and the division always runs first, crashing with <code>ArithmeticException</code> whenever b is 0.`],
        example: {
          label: 'Worked example — combining conditions with && and ||',
          code: `public class Main {
    public static void main(String[] args) {
        int age = 16;
        boolean hasPermit = true;

// ---------- CheerpJ boot ----------
// tools.jar (the in-browser javac) is staged into CheerpJ's own virtual FS via fetch,
// rather than relied on through the "/app/" origin-root mount CheerpJ uses internally —
// that mount resolves against location.origin, not this page's own folder, which breaks
// as soon as the site is hosted under a sub-path (e.g. a GitHub Pages project site).
let cheerpjReady = false;
async function bootCheerpj(){
  const banner = document.getElementById('boot-banner');
  try{
    await cheerpjInit({ status: 'none' });
    cheerpjCreateDisplay(-1, -1, document.getElementById('cj-display-host'));
    const jarBuf = await fetch('./tools.jar').then(r => r.arrayBuffer());
    cheerpOSAddStringFile('/str/tools.jar', new Uint8Array(jarBuf));
    cheerpjReady = true;
    banner.classList.add('ok');
  }catch(e){
    banner.classList.add('err');
    banner.textContent = 'Could not load the Java runtime (needs an internet connection on first load). ' + e;
  }
}
bootCheerpj();

    const p = getProgress(); p[id] = true;

// ---------- Java runner ----------
// Best-effort guard against a student-written infinite loop (Unit 2 introduces while/for).
// CheerpJ cooperatively yields to the event loop, so a timed race can usually still fire
// and unstick the UI even while a runaway loop keeps executing underneath.
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(label + ' timed out — check for an infinite loop')), ms))
  ]);
}

async function runJava(sourceCode, consoleEl, statusEl, runBtn){
  if(!cheerpjReady){
    statusEl.textContent = 'Java runtime still loading — wait a moment and try again.';
    statusEl.className = 'status status-fail';
    return null;
  }
  document.querySelectorAll('.run-btn').forEach(b => b.disabled = true);
  document.querySelectorAll('[data-role="console"]').forEach(el => el.removeAttribute('id'));
  consoleEl.id = 'console';
  consoleEl.textContent = '';
  statusEl.textContent = 'Compiling…';
  statusEl.className = 'status status-pending';
  try{
    const encoder = new TextEncoder();
    cheerpOSAddStringFile('/str/Main.java', encoder.encode(sourceCode));
    const classPath = '/str/tools.jar:/files/';
    const compileCode = await withTimeout(cheerpjRunMain('com.sun.tools.javac.Main', classPath, '/str/Main.java', '-d', '/files/'), 20000, 'Compile');
    if(compileCode !== 0){
      await new Promise(r => setTimeout(r, 150));
      statusEl.textContent = 'Compile error';
      statusEl.className = 'status status-fail';
      return { ok:false, output: consoleEl.textContent };
    }
    statusEl.textContent = 'Running…';
    await withTimeout(cheerpjRunMain('Main', classPath), 15000, 'Run');
    await new Promise(r => setTimeout(r, 150));
    return { ok:true, output: consoleEl.textContent };
  }catch(e){
    statusEl.textContent = 'Error: ' + e;
    statusEl.className = 'status status-fail';
    return { ok:false, output: consoleEl.textContent };
  }finally{
    document.querySelectorAll('.run-btn').forEach(b => b.disabled = false);
  }
}

let expandedUnit = 1;

function topicPassCount(topic){
  if(!topic.exercises) return null;
  const progress = getProgress();
  const done = topic.exercises.filter(e => progress[e.id]).length;
  return done + '/' + topic.exercises.length;
}

function renderNav(currentTopicId){
  const unitNav = document.getElementById('unit-nav');
  unitNav.innerHTML = '';
  UNITS.forEach(u => {
    const group = document.createElement('div');
    group.className = 'unit-group';
    const head = document.createElement('div');
    head.className = 'unit-head';
    head.innerHTML = `<span>Unit ${u.num} — ${u.title}</span><span class="cnt">${u.weight}</span>`;
    const list = document.createElement('div');
    list.className = 'topic-list' + (expandedUnit === u.num ? '' : ' collapsed');
    head.onclick = () => { expandedUnit = (expandedUnit === u.num ? null : u.num); renderNav(currentTopicId); };
    u.topics.forEach(t => {
      const item = document.createElement('div');
      item.className = 'nav-item' + (t.locked ? ' locked' : '') + (t.id === currentTopicId ? ' active' : '');
      const pass = topicPassCount(t);
      item.innerHTML = `<span><span class="nav-num">${t.id}</span>${t.title}</span><span class="nav-weight">${t.locked ? '' : (pass || '')}</span>`;
      if(!t.locked) item.onclick = () => { location.hash = t.id; };
      list.appendChild(item);
    });
    group.appendChild(head);
    group.appendChild(list);
    unitNav.appendChild(group);
  });
  const refNav = document.getElementById('ref-nav');
  refNav.innerHTML = '';
  REFS.forEach(r => {
    const el = document.createElement('div');
    el.className = 'nav-item' + (r.locked ? ' locked' : '') + (r.id === currentTopicId ? ' active' : '');
    el.innerHTML = `<span>${r.title}</span><span class="nav-weight">${r.locked ? 'soon' : ''}</span>`;
    if(!r.locked) el.onclick = () => { location.hash = r.id; };
    refNav.appendChild(el);
  });
}

function buildExerciseCard(topic, ex, idx){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>Exercise ${idx + 1}</h3>
    <div class="prompt">${ex.prompt}</div>
    <textarea class="editor"></textarea>
    <div class="runner-controls">
      <button class="run-btn">Run</button>
      <span class="status"></span>
    </div>
    <pre class="console-out" data-role="console"></pre>
    <div class="hint" style="display:none;font-size:.82rem;color:var(--text-dim);margin-top:8px;">${ex.hint}</div>
  `;
  const textarea = card.querySelector('.editor');
  const cm = CodeMirror.fromTextArea(textarea, {
    mode: 'text/x-java', theme: 'dracula', lineNumbers: true,
    indentUnit: 4, tabSize: 4, viewportMargin: Infinity
  });
  cm.setValue(ex.starter);

  const runBtn = card.querySelector('.run-btn');
  const statusEl = card.querySelector('.status');
  const consoleEl = card.querySelector('.console-out');
  const hintEl = card.querySelector('.hint');

  runBtn.onclick = async () => {
    const result = await runJava(cm.getValue(), consoleEl, statusEl, runBtn);
    if(!result) return;
    const sourceOk = !ex.checkSource || ex.checkSource(cm.getValue());
    if(result.ok && ex.check(result.output) && sourceOk){
      statusEl.textContent = 'Passed';
      statusEl.className = 'status status-pass';
      setDone(ex.id);
      renderNav(topic.id);
      hintEl.style.display = 'none';
    }else if(result.ok){
      statusEl.textContent = 'Ran, but output doesn\'t match yet';
      statusEl.className = 'status status-fail';
      hintEl.style.display = 'block';
    }else{
      hintEl.style.display = 'block';
    }
  };
  return card;
}

    const cm = CodeMirror.fromTextArea(textarea, {
      mode: 'text/x-java', theme: 'dracula', lineNumbers: true,
      indentUnit: 4, tabSize: 4, viewportMargin: Infinity
    });
    cm.setValue(topic.example.code);
    const runBtn = card.querySelector('.run-btn');
    const statusEl = card.querySelector('.status');
    const consoleEl = card.querySelector('.console-out');
    runBtn.onclick = async () => {
      const result = await runJava(cm.getValue(), consoleEl, statusEl, runBtn);
      if(result && result.ok){ statusEl.textContent = 'Ran'; statusEl.className = 'status'; }
    };
    content.appendChild(card);
  }

  (topic.exercises || []).forEach((ex, i) => {
    content.appendChild(buildExerciseCard(topic, ex, i));
  });
}

function renderRef(ref){
  document.getElementById('content').innerHTML = `<h2>${ref.title}</h2><div class="placeholder">Ships in a later build phase.</div>`;
}

function route(){
  const hash = location.hash.replace('#','') || '1.2';
  const topic = ALL_TOPICS.find(t => t.id === hash);
  const ref = REFS.find(r => r.id === hash);
  if(topic) expandedUnit = topic.unit.num;
  renderNav(hash);
  if(topic) renderTopic(topic);
  else if(ref) renderRef(ref);
  else renderTopic(ALL_TOPICS.find(t => !t.locked));
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
